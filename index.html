<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ChatGPT</title>
    <!-- Highlight.js GitHub Dark Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Exact colors derived from dark mode analysis of ChatGPT Web
              'token-main-surface-primary': '#212121', // Dark Gray background
              'token-main-surface-secondary': '#2F2F2F', // Component background
              'token-text-primary': '#ECECEC', // Main text
              'token-text-secondary': '#B4B4B4', // Muted text
              'token-text-tertiary': '#666666', // Icons/Meta
              'user-bubble': '#2F2F2F', // User message bubble
              'input-bg': '#2F2F2F', // Input bar background
            },
            fontFamily: {
              sans: [
                'Söhne',
                'ui-sans-serif',
                'system-ui',
                '-apple-system', 
                'Segoe UI', 
                'Roboto', 
                'Ubuntu', 
                'Cantarell', 
                'Noto Sans', 
                'sans-serif', 
                'Helvetica Neue', 
                'Arial', 
                'Apple Color Emoji', 
                'Segoe UI Emoji', 
                'Segoe UI Symbol', 
                'Noto Color Emoji'
              ],
            },
            spacing: {
              'header-height': '54px',
            }
          },
        },
      }
    </script>
    <style>
      /* Custom Scrollbar hiding for that native app feel */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* iOS Safe Area Utilities */
      .pt-safe {
        padding-top: env(safe-area-inset-top);
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .pb-safe-extra {
        padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
      }
      
      body {
        background-color: #212121;
        color: #ECECEC;
        -webkit-tap-highlight-color: transparent;
      }

      /* Markdown specific styles to match ChatGPT */
      .prose p {
        margin-bottom: 1.25em;
      }
      .prose p:last-child {
        margin-bottom: 0;
      }
      .prose ul, .prose ol {
        margin-bottom: 1.25em;
        padding-left: 1.5em;
      }
      .prose ul {
        list-style-type: disc;
      }
      .prose ol {
        list-style-type: decimal;
      }
      .prose h1, .prose h2, .prose h3, .prose h4 {
        margin-top: 1.5em;
        margin-bottom: 0.8em;
        font-weight: 600;
        line-height: 1.25;
      }
      .prose h1 { font-size: 1.5em; }
      .prose h2 { font-size: 1.25em; }
      .prose h3 { font-size: 1.1em; }
      .prose a {
        color: #60a5fa; /* blue-400 */
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .prose blockquote {
        border-left: 3px solid #666;
        padding-left: 1em;
        margin-left: 0;
        color: #B4B4B4;
      }
      .prose table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.25em;
      }
      .prose th, .prose td {
        border: 1px solid #444;
        padding: 0.5em;
        text-align: left;
      }
      .prose th {
        background-color: #2F2F2F;
        font-weight: 600;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "react-markdown": "https://esm.sh/react-markdown@9?bundle",
    "remark-gfm": "https://esm.sh/remark-gfm@4?bundle",
    "rehype-highlight": "https://esm.sh/rehype-highlight@7?bundle"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
